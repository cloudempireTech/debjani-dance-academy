<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#rubyGrad)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Decorative Orbit Rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(251, 191, 36, 0.25)" stroke-width="1.5"/>

  <!-- Artistic Dancer Silhouette & Ribbon Flow -->
  <g transform="translate(256, 250) scale(1.15)">
    <!-- Swirling Ribbon Wings -->
    <path d="M-80,60 C-110,10 -90,-80 0,-120 C90,-80 110,10 80,60 C40,40 10,-20 0,-30 C-10,-20 -40,40 -80,60 Z" 
          fill="url(#rubyGrad)" opacity="0.35"/>
    <path d="M-60,70 C-90,30 -70,-50 0,-90 C70,-50 90,30 60,70 C30,50 10,-10 0,-20 C-10,-10 -30,50 -60,70 Z" 
          fill="url(#goldGrad)" opacity="0.45"/>

    <!-- Dynamic Classical/Contemporary Dancer Silhouette -->
    <!-- Head & Bun with floral aura -->
    <circle cx="0" cy="-75" r="14" fill="url(#goldGrad)"/>
    <circle cx="-7" cy="-84" r="7" fill="url(#rubyGrad)"/>

    <!-- Torso & Graceful Arched Spine -->
    <path d="M-5,-60 Q0,-40 -3,-10 Q0,10 8,30 Q-2,32 -8,15 Q-10,-20 -9,-58 Z" fill="#ffffff"/>

    <!-- Raised Graceful Arms (Mudras) -->
    <path d="M-6,-52 C-25,-75 -45,-95 -65,-90 C-62,-84 -40,-72 -20,-48 Z" fill="url(#goldGrad)"/>
    <path d="M-2,-50 C15,-72 40,-95 62,-92 C60,-86 38,-72 15,-46 Z" fill="url(#goldGrad)"/>

    <!-- Flowing Skirt / Ghagra Flares -->
    <path d="M-8,15 Q-65,65 -90,95 Q-40,90 0,82 Q40,90 90,95 Q65,65 8,30 Q0,50 -8,15 Z" fill="url(#rubyGrad)" filter="url(#glow)"/>
    <path d="M-6,20 Q-50,60 -70,88 Q-30,82 0,78 Q30,82 70,88 Q50,60 6,32 Z" fill="url(#goldGrad)"/>

    <!-- Raised Balanced Leg -->
    <path d="M-5,40 Q-20,70 -35,95 Q-30,98 -15,75 Q-5,55 -3,40 Z" fill="#ffffff"/>
  </g>

  <!-- Circular Lettering Ring -->
  <path id="textCircleTop" d="M 50,256 A 206,206 0 1,1 462,256" fill="none"/>
  <text fill="url(#goldGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="7">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">DEBJANI DANCE ACADEMY</textPath>
  </text>

  <path id="textCircleBottom" d="M 462,256 A 206,206 0 0,1 50,256" fill="none"/>
  <text fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="5" opacity="0.85">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">KOLKATA · ESTD 2014 · PURBA BARISHA</textPath>
  </text>

  <!-- Star Emblems -->
  <polygon points="50,256 55,250 62,256 55,262" fill="url(#goldGrad)"/>
  <polygon points="462,256 457,250 450,256 457,262" fill="url(#goldGrad)"/>
</svg>